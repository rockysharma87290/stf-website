<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Admin Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Admin Login (OTP)</h2>

<input id="mobile" placeholder="मोबाइल नंबर" />
<br><br>

<!-- 🔴 reCAPTCHA box -->
<div id="recaptcha-container"></div>

<br>
<button id="sendBtn">OTP भेजें</button>

<br><br>
<input id="otp" placeholder="OTP" />
<button id="verifyBtn">Verify</button>

<script type="module">
import { auth } from "./firebase.js";
import {
  signInWithPhoneNumber,
  RecaptchaVerifier
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

/* 🔥 reCAPTCHA render AFTER page load */
window.onload = () => {
  window.recaptchaVerifier = new RecaptchaVerifier(
    'recaptcha-container',
    {
      size: 'normal'
    },
    auth
  );
  recaptchaVerifier.render();
};

document.getElementById("sendBtn").onclick = async () => {
  const phone = "+91" + document.getElementById("mobile").value;
  window.confirmationResult =
    await signInWithPhoneNumber(auth, phone, window.recaptchaVerifier);
  alert("OTP भेज दिया गया");
};

document.getElementById("verifyBtn").onclick = async () => {
  const code = document.getElementById("otp").value;
  await window.confirmationResult.confirm(code);
  alert("Login Successful");
};
</script>

</body>
</html>
